apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abdo-pod-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abdo-pod-reader
  namespace: default
subjects:
  - kind: User
    name: abdo
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: abdo-pod-reader
  apiGroup: rbac.authorization.k8s.io
